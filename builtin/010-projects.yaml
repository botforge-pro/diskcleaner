describes: build output, Python caches, node_modules and Git leftovers in your projects
reversible: true

readme:
  removes: "in each project: `.build` of Swift packages, Gradle `build`, `.apk`/`.aab`, Python's `__pycache__` anywhere outside `node_modules` and `.build`, `node_modules` with a lockfile, temporary files of a dead `git fetch` or `git repack` older than {git-tmp-min-age}, Git LFS objects the remote has, giving up on a repository after {lfs-timeout}"
  keeps: "`node_modules` without a lockfile; anything written within {min-age}, held open by a process or holding a file Git tracks"
  can-lose: "packages installed with `--no-save`, unpublished, or from a registry you no longer reach"

settings:
  - key: git-tmp-min-age
    kind: duration
    default: 1h
    help: keep temporary files of git fetch and repack written within this
  - key: lfs-timeout
    kind: timeout
    default: 10m
    help: give up on a git lfs prune of one repository that runs longer

root: '{project-dirs}'
do:
  - root: '*'
    when: [{exists: .git/}]
    do:
      - remove:
          - {folders: '**/.build', when: [{exists: ../Package.swift}], says: no Package.swift next to it}
          - skip: '**/.build'
          - skip: '**/.git'
          - skip: '**/node_modules'
          - folders: '**/build'
            when: [{any: [{exists: ../build.gradle}, {exists: ../build.gradle.kts}, {exists: ../settings.gradle}, {exists: ../settings.gradle.kts}]}]
          - folders: '**/__pycache__'
        keep: {age: {of: newest-write, within: '{min-age}'}, open: true, tracked: true}
      - when: [{exists: gradlew}]
        remove: [{skip: '**/.git'}, {skip: '**/node_modules'}, {files: '**/*.apk'}, {files: '**/*.aab'}]
        keep: {age: {of: mtime, within: '{min-age}'}, open: true, tracked: true}
      - remove:
          - files: .git/objects/tmp_*
          - files: .git/objects/*/tmp_*
          - {files: .git/objects/pack/.tmp-*, unless: [{alive: {name: '^\.tmp-([0-9]+)-'}}], says: the git repack that writes it is still running}
        keep: {age: {of: mtime, within: '{git-tmp-min-age}'}, open: true}
      - when: [{exists: .git/lfs/objects/*/*/*}]
        run: [git, -C, '{path}', lfs, prune, --verify-remote]
        timeout: '{lfs-timeout}'
        estimate: {run: [git, -C, '{path}', lfs, prune, --dry-run, --verify-remote], timeout: '{lfs-timeout}', match: 'would be pruned \(([^)]*)\)'}
        size: .git/lfs
  - remove:
      - folders: '**/node_modules'
        when:
          - any:
              - {exists: ../package-lock.json}
              - {exists: ../npm-shrinkwrap.json}
              - {exists: ../yarn.lock}
              - {exists: ../pnpm-lock.yaml}
              - above:
                  - {any: [{exists: package-lock.json}, {exists: npm-shrinkwrap.json}, {exists: yarn.lock}, {exists: pnpm-lock.yaml}]}
                  - {any: [{exists: pnpm-workspace.yaml}, {value: {file: package.json, key: [workspaces]}, is: set}]}
        says: no lockfile, reinstall would not restore the same versions
    keep: {age: {of: newest-write, within: '{min-age}'}, open: true, tracked: true}

describes: the npm package cache
reversible: true

readme:
  removes: the npm package cache, where npm keeps every package it has downloaded
  keeps: the packages that `npx` and `npm exec` run from; all while npm installs
  can-lose: installing packages without a connection until npm downloads them again

root: {run: [npm, config, get, cache]}
unless: [{running: ['(^|/)npm(-cli\.js)?( -[^ ]+)* (install|i|in|ins|inst|insta|instal|isnt|isnta|isntal|isntall|add|ci|clean-install|ic|install-clean|isntall-clean|install-test|it|install-ci-test|cit|clean-install-test|sit|update|up|upgrade|udpate|dedupe|ddp|rebuild|rb|cache)( |$)'], says: an npm install is running}]
run: [npm, cache, clean, --force]
size: _cacache

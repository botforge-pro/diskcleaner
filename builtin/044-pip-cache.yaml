describes: the pip package cache
reversible: true

readme:
  removes: the cache of packages and wheels pip has downloaded and built
  keeps: all while pip installs
  can-lose: installing packages without a connection until pip downloads them again

root: {run: [pip3, cache, dir]}
unless: [{running: ['(^|/)pip[0-9.]*( [^ ]+)* (install|download|wheel)( |$)', ' -m pip( [^ ]+)* (install|download|wheel)( |$)'], says: a pip install is running}]
run: [pip3, cache, purge]
size: '{path}'

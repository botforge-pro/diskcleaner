describes: old Homebrew versions and downloads
reversible: false

readme:
  removes: old versions of formulae and casks; every download, whatever its age, giving up after {timeout}
  keeps: installed versions
  can-lose: the old versions

settings:
  - key: timeout
    kind: timeout
    default: 15m
    help: give up on a cleanup that runs longer

when: [{program: brew}]
unless: [{running: ['/Library/Homebrew/brew\.(sh|rb)'], says: a brew command is running}]
run: [brew, cleanup, --prune=all]
dry-run: [--dry-run]
timeout: '{timeout}'
estimate: {match: '(?:would free|has freed) approximately (.+?) of disk space', units: binary}

describes: old Xcode archives, the newest of each app kept
reversible: false

readme:
  removes: archives older than {min-age}
  keeps: the newest {keep} of each app; any archive in a folder not named by a date
  can-lose: the signed builds and their debug symbols

settings:
  - key: min-age
    kind: duration
    default: 15d
    help: remove archives older than this
  - key: keep
    kind: count
    default: "1"
    help: keep this many newest archives of each app

root: ~/Library/Developer/Xcode/Archives
unless: [{running: [{group: xcode}], says: Xcode or an Xcode build is running}]
remove: [{folders: '*.xcarchive'}, {folders: '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]/*.xcarchive'}]
rank:
  per: {file: Info.plist, key: [ApplicationProperties.CFBundleIdentifier, Name]}
  order: {file: Info.plist, key: [CreationDate]}
  spare: {newest: '{keep}'}
keep: {age: {of: {file: Info.plist, key: [CreationDate]}, within: '{min-age}'}}

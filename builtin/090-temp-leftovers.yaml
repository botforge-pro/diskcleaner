describes: temporary folders of killed Go builds and of Xcode exports
reversible: true

readme:
  removes: work folders of killed Go builds, Xcode export leftovers
  keeps: a folder written within {min-age}, held open by a process, holding a socket or a mounted volume

root: {run: [getconf, DARWIN_USER_TEMP_DIR]}
remove: [{folders: 'go-build*'}, {folders: 'go-link-*'}, {folders: 'XcodeDistPipeline.*'}]
keep: {age: {of: newest-write, within: '{min-age}'}, open: true}

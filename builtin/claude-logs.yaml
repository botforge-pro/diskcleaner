name: claude-logs
order: 150
label: CLAUDE
describes: old Claude Code session logs
reversible: false

readme:
  removes: Claude Code session logs older than {min-age}
  keeps: open logs
  can-lose: resuming those sessions

settings:
  - key: min-age
    kind: duration
    default: 20d
    help: remove session logs older than this

root: $CLAUDE_CONFIG_DIR/projects or ~/.claude/projects

remove:
  files: ['**/*.jsonl']

keep:
  written-within: min-age
  open: true
  tracked-by-git: true

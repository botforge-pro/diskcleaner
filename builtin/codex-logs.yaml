order: 160
describes: old Codex session logs
reversible: false

readme:
  removes: Codex session logs older than {min-age}
  keeps: open logs
  can-lose: resuming those sessions

settings:
  - key: min-age
    kind: duration
    default: 20d
    help: remove session logs older than this

root: $CODEX_HOME/sessions or ~/.codex/sessions
remove: [{files: '**/*.jsonl'}]
keep: {age: {of: mtime, within: '{min-age}'}, open: true, tracked: true}

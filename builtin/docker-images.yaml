order: 30
describes: Docker images not used by any container
reversible: true

readme:
  removes: images no container uses, giving up on a Docker that does not answer after {timeout} and on a prune after {prune-timeout}
  keeps: volumes
  can-lose: an image neither a registry nor a Dockerfile still has

settings:
  - key: timeout
    kind: timeout
    default: 30s
    help: give up on a Docker that does not answer within this
  - key: prune-timeout
    kind: timeout
    default: 15m
    help: give up on a prune that runs longer

needs: [docker]

ready:
  run: [docker, info]
  timeout: timeout
  hung: the Docker daemon is hung, restart Docker Desktop
  down:
    processes: ['com\.docker\.backend']
    says: Docker Desktop is not running

remove:
  run: [docker, image, prune, --all, --force]
  timeout: prune-timeout
  estimate:
    run: [docker, system, df, --format, "{{.Type}}\t{{.Reclaimable}}"]
    timeout: timeout
    match: '^Images\t([^ ]+)'
    none: '^Images\t0B'
  size:
    measure: ~/Library/Containers/com.docker.docker
  shows: '^Total reclaimed space'

order: 10
describes: build output, Python caches, node_modules and Git leftovers in your projects
reversible: true

readme:
  removes: "in each project: `.build` of Swift packages, Gradle `build`, `.apk`/`.aab`, Python's `__pycache__` anywhere outside `node_modules` and `.build`, `node_modules` with a lockfile, temporary files of a dead `git fetch` or `git repack` older than {git-tmp-min-age}, Git LFS objects the remote has, giving up on a repository after {lfs-timeout}"
  keeps: "`node_modules` without a lockfile; anything written within {min-age}, held open by a process or holding a file Git tracks"
  can-lose: "packages installed with `--no-save`, unpublished, or from a registry you no longer reach"

settings:
  - key: git-tmp-min-age
    kind: duration
    default: 1h
    help: keep temporary files of git fetch and repack written within this
  - key: lfs-timeout
    kind: timeout
    default: 10m
    help: give up on a git lfs prune of one repository that runs longer

root: {setting: project-dirs}

parts:
  - each: {folders: ['*'], has: [.git/]}
    remove:
      folders:
        - {glob: '**/.build', beside: [Package.swift], says: no Package.swift next to it}
        - {glob: '**/build', beside-any: [build.gradle, build.gradle.kts, settings.gradle, settings.gradle.kts]}
        - '**/__pycache__'
      outside: [.git, node_modules, .build]
    keep: {age: {of: newest-write, within: min-age}, open: true, tracked: true}

  - each: {folders: ['*'], has: [.git/, gradlew]}
    remove:
      files: ['**/*.apk', '**/*.aab']
      outside: [.git, node_modules]
    keep: {age: {of: mtime, within: min-age}, open: true, tracked: true}

  - each: {folders: ['*'], has: [.git/]}
    remove:
      files: [.git/objects/tmp_*, .git/objects/*/tmp_*, .git/objects/pack/.tmp-*]
    keep:
      age: {of: mtime, within: git-tmp-min-age}
      open: true
      alive: {pid: '^\.tmp-([0-9]+)-', says: the git repack that writes it is still running}

  - each: {folders: ['*'], has: [.git/]}
    remove:
      has: [.git/lfs/objects/*/*/*]
      run: [git, -C, '{path}', lfs, prune, --verify-remote]
      timeout: lfs-timeout
      estimate:
        run: [git, -C, '{path}', lfs, prune, --dry-run, --verify-remote]
        timeout: lfs-timeout
        line: would be pruned
        match: '\(([^)]*)\)'
        none: '\b0 files? would be pruned'
      size: {measure: .git/lfs}

  - remove:
      folders:
        - glob: '**/node_modules'
          beside-any: [package-lock.json, npm-shrinkwrap.json, yarn.lock, pnpm-lock.yaml]
          or-above:
            - any: [package-lock.json, npm-shrinkwrap.json, yarn.lock, pnpm-lock.yaml]
            - any: [pnpm-workspace.yaml, {file: package.json, key: workspaces}]
          says: no lockfile, reinstall would not restore the same versions
    keep: {age: {of: newest-write, within: min-age}, open: true, tracked: true}

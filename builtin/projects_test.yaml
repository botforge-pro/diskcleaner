- case: build output, packages and dead Git temporary files go, and the rest stays
  settings: {project-dirs: ~/Developer}
  files:
    Developer/swiftapp/.git/:
    Developer/swiftapp/Packages/Core/Package.swift: 2h
    Developer/swiftapp/Packages/Core/.build/debug/Core.o: 2h
    Developer/swiftapp/tools/.build/deploy.sh: 2h
    Developer/swiftapp/.git/objects/pack/tmp_pack_died: 2h
    Developer/swiftapp/.git/objects/tmp_obj_died: 2h
    Developer/swiftapp/.git/objects/pack/tmp_pack_fetching:
    Developer/swiftapp/.git/objects/pack/pack-kept.pack: 2h
    Developer/swiftapp/.git/objects/pack/.tmp-99999999-pack-died.pack: 2h
    Developer/swiftapp/.git/objects/pack/.tmp-1-pack-repacking.pack: 2h
    Developer/androidapp/.git/:
    Developer/androidapp/gradlew: 2h
    Developer/androidapp/settings.gradle.kts: 2h
    Developer/androidapp/app/build.gradle.kts: 2h
    Developer/androidapp/lib/build.gradle.kts: 2h
    Developer/androidapp/lib/build/generated-source.kt: 2h
    Developer/androidapp/app/build/outputs/apk/app-debug.apk: 2h
    Developer/androidapp/app/build/tmp/pkg/Package.swift: 2h
    Developer/androidapp/app/build/tmp/pkg/.build/cache: 2h
    Developer/androidapp/app/release/app-release.aab: 2h
    Developer/androidapp/docs/build/index.html: 2h
    Developer/androidapp/docs/build/site/Package.swift: 2h
    Developer/androidapp/docs/build/site/.build/cache: 2h
    Developer/not-a-repo/build/x: 2h
  tracked: [Developer/androidapp/lib/build/generated-source.kt]
  removes:
    - Developer/swiftapp/Packages/Core/.build
    - Developer/swiftapp/.git/objects/pack/tmp_pack_died
    - Developer/swiftapp/.git/objects/tmp_obj_died
    - Developer/swiftapp/.git/objects/pack/.tmp-99999999-pack-died.pack
    - Developer/androidapp/app/build
    - Developer/androidapp/app/release/app-release.aab
    - Developer/androidapp/docs/build/site/.build
  says:
    - 'swiftapp/tools/.build: no Package.swift next to it'
    - 'androidapp/lib/build: contains files tracked by git'
    - 'pack-repacking.pack: the git repack that writes it is still running'
  counts: 7


- case: Git LFS prunes what it would prune, and the freed space is measured
  settings: {project-dirs: ~/Developer}
  files:
    Developer/media/.git/:
    Developer/media/.git/lfs/objects/ab/cd/old: 2h
    Developer/media/.git/lfs/objects/ef/gh/kept: 2h
  commands:
    git -C ~/Developer/media lfs prune --dry-run --verify-remote: {stdout: "prune: 2 local objects, 1 retained\rprune: 1 file would be pruned (1.2 MB)\n"}
    git -C ~/Developer/media lfs prune --verify-remote: {stdout: "prune: Deleting objects: 100% (1/1), done.\n", removes: [Developer/media/.git/lfs/objects/ab]}
  removes: [Developer/media/.git/lfs/objects/ab]
  shows: ['RUN           git -C ', 'lfs prune --verify-remote  (1.2 MB)']
  counts: 1


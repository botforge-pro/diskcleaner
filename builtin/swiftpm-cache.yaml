name: swiftpm-cache
order: 60
label: SWIFTPM
describes: the Swift Package Manager cache
reversible: true

readme:
  removes: the SwiftPM package cache
  keeps: all while Swift or Xcode build

root: ~/Library/Caches/org.swift.swiftpm

busy:
  processes: [swift-build, swift-package, swift-test, swift-run]
  groups: [xcode]
  says: a Swift package build, xcodebuild or Xcode is running

remove: root

order: 70
describes: Xcode DerivedData
reversible: true

readme:
  keeps: all while Xcode builds; in a folder you picked in Xcode, what Xcode did not make

root:
  - command: [defaults, read, com.apple.dt.Xcode, IDECustomDerivedDataLocation]
    absolute: true
    remove:
      folders: ['*.noindex', SDKExplicitPrecompiledModules, {match: '^.+-[a-z]{28}$', has: [info.plist]}]
      others: not made by Xcode
  - ~/Library/Developer/Xcode/DerivedData

busy:
  groups: [xcode]
  says: Xcode or an Xcode build is running

remove:
  folders: ['*']
